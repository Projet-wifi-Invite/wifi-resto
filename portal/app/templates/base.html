<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wi-Fi {{ restaurant.name }}</title>
  <style>
    :root { --primary: {{ restaurant.primary_color }}; --butter: #ffd87b; --sky: #93b9d8; }
    body { font-family: system-ui, sans-serif; margin: 0; color: #222;
           background: repeating-linear-gradient(90deg, var(--butter) 0 28px, var(--sky) 28px 56px); }
    main { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
    .logo { display: block; width: 150px; margin: 0 auto 16px; border-radius: 12px; }
    h1 { color: var(--primary); font-size: 1.5rem; text-align: center; margin: 0 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    label { display: block; margin: 12px 0; }
    input[type=email] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button, .btn { display: block; width: 100%; padding: 14px; border: 0; border-radius: 8px;
                   background: var(--primary); color: #fff; font-size: 1rem; text-align: center;
                   text-decoration: none; box-sizing: border-box; margin-top: 12px; }
    .btn-secondary { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
    details { margin-top: 16px; font-size: .85rem; color: #555; }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="{{ url_for('static', filename='logo-coeur-de-beurre.png') }}" alt="{{ restaurant.name }}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
