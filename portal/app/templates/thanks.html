{% extends "base.html" %}
{% block content %}
<h1>Vous êtes connecté</h1>
<div class="card">
  <p>Bonne dégustation chez {{ restaurant.name }} !</p>
  {% if restaurant.google_reviews_url %}
  <a class="btn" href="{{ restaurant.google_reviews_url }}">Laisser un avis sur Google</a>
  {% endif %}
  {% if restaurant.instagram_url %}
  <a class="btn btn-secondary" href="{{ restaurant.instagram_url }}">Suivre sur Instagram</a>
  {% endif %}
</div>
{% endblock %}
